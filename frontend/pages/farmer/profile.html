<!DOCTYPE html>
<html>
<head>
  <title>Farmer Profile</title>
  <link rel="shortcut icon" href="../../assets/AGC.png" type="image/png"> 
  <link rel="stylesheet" href="../../css/farmer-styles/profile.css">
</head>
<body>
   <header>
    <h1>🌾 Farmer Profile</h1>
  </header>

  <section class="profile-section">
    <div class="profile-card" id="profile"></div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </section>
  <script>
    const farmer = JSON.parse(localStorage.getItem('farmer'));

    if (!farmer) {
      window.location.href = '/login'; // force login if not found
    } else {
      const profileDiv = document.getElementById('profile');
      profileDiv.innerHTML = `
        <p><strong>ID:</strong> ${farmer.farmer_id}</p>
        <p><strong>Name:</strong> ${farmer.farmer_name}</p>
        <p><strong>Phone:</strong> ${farmer.farmer_phone_num}</p>
        <p><strong>Aadhar:</strong> ${farmer.farmer_aadhar_num}</p>
        <p><strong>Village:</strong> ${farmer.farmer_village}</p>
        <img src="https://res.cloudinary.com/dicmdo152/image/upload/farmers/${farmer.photo}" alt="Farmer Photo" width="150"/>
      `;
    }
    function logout() {
    localStorage.removeItem('farmer');
    window.location.href = '/login';
  }
  </script>
</body>
</html>
