<!DOCTYPE html>
<html>
<head>
  <title>Buyer Profile</title>
  <link rel="shortcut icon" href="../../assets/AGC.png" type="image/png"> 
  <link rel="stylesheet" href="../../css/farmer-styles/profile.css">
</head>
<body>
  <header>
    <h1>🌾 Buyer Profile</h1>
  </header>

  <section class="profile-section">
    <div class="profile-card" id="profile"></div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </section>

  <script>
    const buyer = JSON.parse(localStorage.getItem('buyer'));

    if (!buyer) {
      window.location.href = '/login'; // force login if not found
    } else {
      const profileDiv = document.getElementById('profile');
      profileDiv.innerHTML = `
        <p><strong>ID:</strong> ${buyer.buyer_id}</p>
        <p><strong>Name:</strong> ${buyer.buyer_name}</p>
        <p><strong>Phone:</strong> ${buyer.buyer_phone_num}</p>
        <p><strong>Village:</strong> ${buyer.buyer_village}</p>
      `;
    }
    function logout() {
    localStorage.removeItem('buyer');
    window.location.href = '/login';
  }
  </script>
</body>
</html>
